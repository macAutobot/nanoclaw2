version: '3.8'

services:
  nanoclaw:
    build:
      context: .
      dockerfile: Dockerfile
    image: nanoclaw:latest
    container_name: nanoclaw-app
    restart: unless-stopped
    
    # Mount Docker socket to allow container management
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./groups:/app/groups
      - ./auth-store:/app/auth-store
      - ./config-examples:/app/config-examples:ro
      - ./.mcp.json:/app/.mcp.json
    
    # Environment variables
    environment:
      - NODE_ENV=production
      - CONTAINER_RUNTIME=docker
      - TZ=UTC
      # Add your API keys here or use .env file
      # - ANTHROPIC_API_KEY=your_api_key_here
    
    # Optional: Use .env file for sensitive data
    env_file:
      - .env
    
    # Network configuration
    networks:
      - nanoclaw-network
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Healthcheck (optional)
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Agent container builder (builds the agent image on startup)
  agent-builder:
    build:
      context: ./container
      dockerfile: Dockerfile
    image: nanoclaw-agent:latest
    container_name: nanoclaw-agent-builder
    command: /bin/true
    networks:
      - nanoclaw-network

networks:
  nanoclaw-network:
    driver: bridge

volumes:
  nanoclaw-data:
  nanoclaw-groups:
  nanoclaw-auth:
